name: workshop-openrouter-opencode-claude
base: ubuntu@24.04
sdks:
  - name: opencode
    channel: latest/stable
  - name: claude-code
    channel: latest/stable
  - name: direnvrc
    channel: latest/stable

actions:
  opencode:     direnv exec /project opencode "$@"
  opencode-run: direnv exec /project opencode run -m openrouter/qwen/qwen3-max "$@"
  claude:      direnv exec /project claude --dangerously-skip-permissions "$@"
  claude-exec: direnv exec /project claude --bare --print "$@"

  app: direnv exec /project python3 manage.py runserver 0.0.0.0:8000
